<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Receita | Minhas Receitas Web</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header>
    <div class="container cabecalho">
      <a class="logo" href="index.html">Minhas Receitas</a>
      <nav aria-label="Navegação principal">
        <ul><li><a href="index.html">Início</a></li><li><a href="cadastro.html">Cadastrar receita</a></li></ul>
      </nav>
    </div>
  </header>

  <main class="container pagina-formulario">
    <section aria-labelledby="titulo-cadastro">
      <p class="destaque">Nova receita</p>
      <h1 id="titulo-cadastro">Cadastrar receita</h1>
      <p>Preencha as informações abaixo para registrar uma receita.</p>

      <div id="mensagem-form" class="mensagem" aria-live="polite"></div>

      <form class="formulario" id="form-receita" novalidate>
        <div class="campo">
          <label for="nome">Nome da receita</label>
          <input type="text" id="nome" name="nome">
        </div>
        <div class="campo">
          <label for="categoria">Categoria</label>
          <select id="categoria" name="categoria">
            <option value="">Selecione uma categoria</option>
            <option value="Sobremesas">Sobremesas</option>
            <option value="Massas">Massas</option>
            <option value="Lanches">Lanches</option>
            <option value="Outros">Outros</option>
          </select>
        </div>
        <div class="campo">
          <label for="tempo">Tempo de preparo (minutos)</label>
          <input type="number" id="tempo" name="tempo" min="1">
        </div>
        <div class="campo">
          <label for="ingredientes">Ingredientes</label>
          <textarea id="ingredientes" name="ingredientes" rows="7" placeholder="Digite um ingrediente por linha"></textarea>
          <small id="contador-ingredientes">0 ingredientes informados</small>
        </div>
        <div class="campo">
          <label for="preparo">Modo de preparo</label>
          <textarea id="preparo" name="preparo" rows="8"></textarea>
        </div>
        <div class="acoes-formulario">
          <a class="botao-secundario" href="index.html">Cancelar</a>
          <button type="submit">Cadastrar receita</button>
        </div>
      </form>
    </section>
  </main>

  <footer><div class="container"><p>Minhas Receitas Web — Projeto acadêmico de Engenharia da Computação.</p></div></footer>
</body>
</html>
